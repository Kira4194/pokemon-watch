name: Veille cartes Pokémon

on:
  schedule:
    - cron: "0 7 * * *"  # tous les jours à 7h UTC (8h/9h en France) : prix de la vitrine + Pokédex
  workflow_dispatch:  # permet aussi de le lancer à la main (envoie alors le récapitulatif)

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prix du Pokédex (toutes les cartes, possédées ou manquantes)
        run: python pokedex.py

      - name: Lancer la veille (cartes de la vitrine)
        run: python track.py
        env:
          POKEMONTCG_API_KEY: ${{ secrets.POKEMONTCG_API_KEY }}
          POKEPRICETRACKER_API_KEY: ${{ secrets.POKEPRICETRACKER_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Sauvegarder l'historique
        if: always()
        run: |
          git config user.name "price-watch-bot"
          git config user.email "price-watch-bot@users.noreply.github.com"
          git add history.csv state.json
          if [ -f pokedex_prices.json ]; then git add pokedex_prices.json; fi
          git diff --cached --quiet || git commit -m "Mise à jour des prix $(date +%F)"
          git push
