name: Veille cartes Pokémon

on:
  schedule:
    - cron: "0 7 1,10,20 * *"   # les 1er, 10 et 20 de chaque mois à 7h UTC
  workflow_dispatch:             # permet aussi de le lancer à la main

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Lancer la veille
        run: python track.py
        env:
          POKEMONTCG_API_KEY: ${{ secrets.POKEMONTCG_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Sauvegarder l'historique
        run: |
          git config user.name "price-watch-bot"
          git config user.email "price-watch-bot@users.noreply.github.com"
          git add history.csv
          git diff --cached --quiet || git commit -m "Mise à jour des prix $(date +%F)"
          git push
