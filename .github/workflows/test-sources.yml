name: Test des sources de prix

# Se lance tout seul à chaque envoi sur la branche test-sources (ne touche pas à la veille quotidienne).
on:
  push:
    branches: [test-sources]
    paths: [test_sources.py, test_mapping.py, .github/workflows/test-sources.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tester la correspondance cartes → Cardmarket
        run: python test_mapping.py

      - name: Enregistrer le rapport
        run: |
          cat test_mapping_report.md >> "$GITHUB_STEP_SUMMARY"
          git config user.name "price-watch-bot"
          git config user.email "price-watch-bot@users.noreply.github.com"
          git add test_mapping_report.md
          git diff --cached --quiet || git commit -m "Rapport du test des sources $(date +%F)"
          git push
